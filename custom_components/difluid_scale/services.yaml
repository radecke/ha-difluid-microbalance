delete_brew:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: difluid_scale
    device_id:
      selector:
        device:
          integration: difluid_scale
    brew_id:
      required: true
      example: "01JD7Z3Q0V7H4M2N5P8R6S9T0W"
      selector:
        text:

learn_stop_from_brew:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: difluid_scale
    device_id:
      selector:
        device:
          integration: difluid_scale
    brew_id:
      required: true
      example: "01JD7Z3Q0V7H4M2N5P8R6S9T0W"
      selector:
        text:
    cut_offset:
      required: true
      example: 27.83
      selector:
        number:
          min: 0
          max: 600
          step: 0.01
          unit_of_measurement: s
          mode: box
    target:
      example: 38
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: g
          mode: box

add_bean:
  fields:
    name:
      required: true
      example: "Kenya Kiambu"
      selector:
        text:
    ratio:
      example: 2.2
      selector:
        number:
          min: 0.5
          max: 5
          step: 0.1
          mode: box
    note:
      example: "Light roast, grind 12"
      selector:
        text:
          multiline: true
    activate:
      default: true
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: difluid_scale

delete_bean:
  fields:
    name:
      example: "Kenya Kiambu"
      selector:
        text:
    bean_id:
      example: "01JD7Z3Q0V7H4M2N5P8R6S9T0W"
      selector:
        text:
    active:
      default: false
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: difluid_scale
